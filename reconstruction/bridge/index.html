<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video reconstruction</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 780px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fafafa;
      color: #202124;
    }
    h1 { font-size: 26px; }
    input, button { font: inherit; padding: 9px; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; }
    section {
      background: white;
      border: 1px solid #ddd;
      padding: 18px;
      margin: 16px 0;
      border-radius: 8px;
    }
    progress { width: 100%; height: 18px; }
    small { color: #555; }
    pre { white-space: pre-wrap; font: inherit; color: #a12622; }
    a { margin-right: 15px; }
    #notice { min-height: 24px; }
  </style>
</head>
<body>
  <h1>Video reconstruction</h1>
  <p>Choose a video to reconstruct on Kaggle. Keep this window or the local bridge available to retrieve the result.</p>
  <section id="login" hidden>
    <label>Local operator key <input id="key" type="password" autocomplete="off"></label>
    <button id="signin">Sign in</button>
  </section>
  <section>
    <form id="upload">
      <input id="video" type="file" accept="video/*" required>
      <button id="submit">Upload and reconstruct</button>
    </form>
    <progress id="uploadProgress" value="0" max="100" hidden></progress>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
  <div id="runs"></div>
  <script>
    const $ = id => document.getElementById(id);
    let uploading = false;

    function text(tag, value, parent) {
      const element = document.createElement(tag);
      element.textContent = value;
      parent.append(element);
      return element;
    }

    async function login(key) {
      const response = await fetch('/api/session', {
        method: 'POST',
        headers: { 'X-Operator-Secret': key }
      });
      if (!response.ok) {
        $('login').hidden = false;
        throw Error('Invalid operator key. Use the private URL printed by the bridge.');
      }
      $('key').value = '';
      $('login').hidden = true;
      await refresh();
    }

    async function retry(run, button) {
      button.disabled = true;
      try {
        const response = await fetch(`/api/runs/${run.id}/retry`, { method: 'POST' });
        if (!response.ok) throw Error((await response.json()).detail);
        await refresh();
      } catch (error) {
        $('notice').textContent = error.message;
        button.disabled = false;
      }
    }

    function renderRun(run) {
      const box = document.createElement('section');
      text('strong', run.filename, box);
      text('p', `${run.status} · ${run.stage} · attempt ${run.attempt}`, box);
      const progress = document.createElement('progress');
      progress.max = 100;
      if (run.progress !== null) progress.value = run.progress;
      box.append(progress);
      const percent = run.progress === null ? 'In progress' : `${Math.round(run.progress)}%`;
      text('small', `${percent} · ${run.id}`, box);
      if (run.message) text('p', run.message, box);
      if (run.error) text('pre', run.error, box);
      if (['failed', 'timed_out'].includes(run.status)) {
        const button = text('button', 'Retry', box);
        button.onclick = () => retry(run, button);
      }
      if (run.status === 'completed') {
        const row = document.createElement('p');
        for (const name of ['scene.splat', 'run_manifest.json']) {
          const link = text('a', name, row);
          link.href = `/api/runs/${run.id}/artifacts/${name}`;
          link.download = name;
        }
        box.append(row);
      }
      return box;
    }

    async function refresh() {
      try {
        const response = await fetch('/api/runs');
        if (response.status === 401) {
          $('login').hidden = false;
          return;
        }
        if (!response.ok) throw Error('Could not read run status.');
        $('login').hidden = true;
        const runs = await response.json();
        $('runs').replaceChildren(...runs.slice(0, 1).map(renderRun));
        if (!uploading) {
          $('notice').textContent = 'Latest run shown. Status is saved locally and survives a page refresh.';
        }
      } catch (error) {
        $('notice').textContent = 'Bridge unavailable. Reopen it with the same storage directory to recover status.';
      }
    }

    $('signin').onclick = () => login($('key').value).catch(error => {
      $('notice').textContent = error.message;
    });

    $('upload').onsubmit = event => {
      event.preventDefault();
      const file = $('video').files[0];
      if (!file) return;
      uploading = true;
      $('submit').disabled = true;
      $('uploadProgress').value = 0;
      $('uploadProgress').hidden = false;
      $('notice').textContent = 'Uploading video…';
      const request = new XMLHttpRequest();
      request.open('POST', '/api/runs');
      request.setRequestHeader('X-Filename', encodeURIComponent(file.name));
      request.upload.onprogress = event => {
        if (event.lengthComputable) $('uploadProgress').value = 100 * event.loaded / event.total;
      };
      function finishUpload() {
        uploading = false;
        $('submit').disabled = false;
        $('uploadProgress').hidden = true;
      }
      request.onload = () => {
        finishUpload();
        if (request.status >= 200 && request.status < 300) {
          $('video').value = '';
          refresh();
        } else {
          let message = 'Upload failed.';
          try { message = JSON.parse(request.responseText).detail || message; } catch {}
          $('notice').textContent = message;
        }
      };
      request.onerror = () => {
        finishUpload();
        $('notice').textContent = 'Upload connection lost. Check bridge status and upload again.';
      };
      request.send(file);
    };

    (async () => {
      if (location.hash.length > 1) {
        const key = decodeURIComponent(location.hash.slice(1));
        history.replaceState(null, '', location.pathname);
        await login(key);
      } else {
        await refresh();
      }
    })().catch(error => { $('notice').textContent = error.message; });
    setInterval(refresh, 3000);
  </script>
</body>
</html>
